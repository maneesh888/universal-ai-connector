name: Universal AI Connector Live Verification

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read

concurrency:
  group: live-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  impact:
    name: Detect live impact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      head_sha: ${{ steps.classify.outputs.head_sha }}
      live_required: ${{ steps.classify.outputs.live_required }}
      live_providers: ${{ steps.classify.outputs.live_providers }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Classify exact-head live impact
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          checked_out_sha="$(git rev-parse HEAD)"

          if [[ "$EVENT_NAME" != "pull_request" ||
                "$checked_out_sha" != "$PR_HEAD_SHA" ]]; then
            echo "The checked-out commit does not match the pull-request head."
            exit 1
          fi
          if git cat-file -e "$PR_BASE_SHA:scripts/live-impact.sh" 2>/dev/null; then
            trusted_classifier="$RUNNER_TEMP/live-impact.sh"
            git show "$PR_BASE_SHA:scripts/live-impact.sh" > "$trusted_classifier"
            chmod +x "$trusted_classifier"
            live_providers="$(
              UAC_REPOSITORY_ROOT="$GITHUB_WORKSPACE" \
                "$trusted_classifier" "$PR_BASE_SHA" "$PR_HEAD_SHA"
            )"
          else
            bootstrap_changed_paths="$RUNNER_TEMP/live-bootstrap-changed-paths"
            if ! git diff \
              --name-only \
              --diff-filter=ACDMRT \
              -z \
              "$PR_BASE_SHA...$PR_HEAD_SHA" > "$bootstrap_changed_paths"; then
              echo "Live-impact bootstrap could not compare the requested commits."
              exit 1
            fi
            while IFS= read -r -d '' bootstrap_changed_path; do
              case "$bootstrap_changed_path" in
                bridge/src/* | \
                  bridge/build.gradle.kts | \
                  swift-package/* | \
                  build.gradle.kts | \
                  settings.gradle.kts | \
                  gradle.properties | \
                  gradle/* | \
                  buildSrc/* | \
                  build-logic/* | \
                  gradlew | \
                  gradlew.bat)
                  echo "Live-impact bootstrap refuses source or build behavior."
                  exit 1
                  ;;
              esac
            done < "$bootstrap_changed_paths"
            live_providers=none
          fi
          head_sha="$PR_HEAD_SHA"

          case "$live_providers" in
            true)
              # Compatibility with the trusted P4 classifier during the P5-A transition.
              live_providers=openai
              ;;
            false)
              live_providers=none
              ;;
            none | openai | anthropic | openrouter | \
              openai,anthropic | openai,openrouter | anthropic,openrouter | \
              openai,anthropic,openrouter)
              ;;
            *)
              echo "Live-impact classification produced an invalid provider set."
              exit 1
              ;;
          esac
          if [[ "$live_providers" == "none" ]]; then
            live_required=false
          else
            live_required=true
          fi

          if [[ ! "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Live-impact classification produced invalid output."
            exit 1
          fi

          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "live_required=$live_required" >> "$GITHUB_OUTPUT"
          echo "live_providers=$live_providers" >> "$GITHUB_OUTPUT"

  required-live-verification:
    name: Required live verification
    if: always()
    needs:
      - impact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: live-policy
    steps:
      - name: Enforce exact-head local live evidence policy
        env:
          HEAD_SHA: ${{ needs.impact.outputs.head_sha }}
          IMPACT_RESULT: ${{ needs.impact.result }}
          LIVE_REQUIRED: ${{ needs.impact.outputs.live_required }}
          LIVE_PROVIDERS: ${{ needs.impact.outputs.live_providers }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [[ "$IMPACT_RESULT" != "success" ]]; then
            echo "Live-impact classification did not pass."
            exit 1
          fi

          if [[ "$LIVE_REQUIRED" != "true" ]]; then
            echo "This exact head does not require local provider credentials."
            exit 0
          fi

          echo "Retained local evidence is required for: $LIVE_PROVIDERS"
          if [[ "$PR_BODY" != *"Local live verification: passed"* ]]; then
            echo "The pull request must record 'Local live verification: passed'."
            exit 1
          fi
          if [[ "$PR_BODY" != *"$HEAD_SHA"* ]]; then
            echo "The pull request does not bind local live evidence to this exact head."
            exit 1
          fi
          if [[ "$PR_BODY" != *"No credential or provider response body retained."* ]]; then
            echo "The pull request must record the live-proof retention boundary."
            exit 1
          fi

          echo "Exact-head local live evidence was recorded for policy review."
          echo "GitHub did not execute provider tests or receive provider credentials."
