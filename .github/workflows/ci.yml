name: Universal AI Connector CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    name: Classify verification impact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full_required: ${{ steps.classify.outputs.full_required }}
    steps:
      - name: Check out sources and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Classify exact-head verification impact
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            base_sha="$PUSH_BASE_SHA"
          else
            echo "full_required=true" >> "$GITHUB_OUTPUT"
            echo "Manual CI runs always select complete verification."
            exit 0
          fi

          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]] ||
            ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
            echo "full_required=true" >> "$GITHUB_OUTPUT"
            echo "A trustworthy base commit is unavailable; selecting complete verification."
            exit 0
          fi

          if ! git cat-file -e "$base_sha:scripts/verification-impact.sh" 2>/dev/null; then
            echo "full_required=true" >> "$GITHUB_OUTPUT"
            echo "The trusted base has no verification classifier; selecting complete verification."
            exit 0
          fi

          trusted_classifier="$RUNNER_TEMP/verification-impact.sh"
          git show "$base_sha:scripts/verification-impact.sh" > "$trusted_classifier"
          chmod +x "$trusted_classifier"
          impact="$(UAC_REPOSITORY_ROOT="$GITHUB_WORKSPACE" \
            "$trusted_classifier" "$base_sha" "$HEAD_SHA")"
          case "$impact" in
            docs-only)
              echo "full_required=false" >> "$GITHUB_OUTPUT"
              ;;
            full)
              echo "full_required=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Verification-impact classification returned an invalid result."
              exit 1
              ;;
          esac

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Run repository hygiene and script tests
        run: ./scripts/check.sh --hygiene

  jvm-android-linux:
    name: JVM + Android (Linux)
    needs: impact
    if: ${{ needs.impact.outputs.full_required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.1.0

      - name: Run JVM and Android checks
        run: >-
          ./gradlew
          :bridge:jvmTest
          :bridge:testAndroidHostTest
          :bridge:bundleAndroidMainAar
          :samples:jvm-console:consumerCheck
          :samples:android:consumerCheck
          --stacktrace

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-jvm-android-failure-evidence
          path: |
            bridge/build/reports/tests/
            samples/jvm-console/build/reports/tests/
            samples/android/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

  jvm-windows:
    name: JVM (Windows)
    needs: impact
    if: ${{ needs.impact.outputs.full_required == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Run JVM checks
        run: ./gradlew.bat :bridge:jvmTest :samples:jvm-console:consumerCheck --stacktrace

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-jvm-failure-evidence
          path: |
            bridge/build/reports/tests/
            samples/jvm-console/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

  apple-jvm:
    name: Apple + JVM (macOS)
    needs: impact
    if: ${{ needs.impact.outputs.full_required == 'true' }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install ripgrep
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install ripgrep

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.1.0

      - name: Report toolchain versions
        run: |
          java -version
          xcodebuild -version

      - name: Run JVM checks
        run: ./gradlew :bridge:jvmTest :samples:jvm-console:consumerCheck --stacktrace

      - name: Run complete Apple verification
        env:
          UAC_SWIFT_RESULT_BUNDLE_PATH: ${{ runner.temp }}/uac-swift-package.xcresult
        run: ./scripts/check.sh --full

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apple-failure-evidence
          path: |
            ${{ runner.temp }}/uac-swift-package.xcresult
            bridge/build/reports/tests/
            samples/jvm-console/build/reports/tests/
            samples/android/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

  required-checks:
    name: Required checks
    if: always()
    runs-on: ubuntu-latest
    needs:
      - impact
      - hygiene
      - jvm-android-linux
      - jvm-windows
      - apple-jvm
    steps:
      - name: Confirm required jobs passed
        env:
          HYGIENE_RESULT: ${{ needs.hygiene.result }}
          IMPACT_RESULT: ${{ needs.impact.result }}
          FULL_REQUIRED: ${{ needs.impact.outputs.full_required }}
          JVM_ANDROID_LINUX_RESULT: ${{ needs.jvm-android-linux.result }}
          JVM_WINDOWS_RESULT: ${{ needs.jvm-windows.result }}
          APPLE_JVM_RESULT: ${{ needs.apple-jvm.result }}
        run: |
          if [[ "$IMPACT_RESULT" != "success" || "$HYGIENE_RESULT" != "success" ]]; then
            echo "Required checks did not pass."
            echo "impact=$IMPACT_RESULT"
            echo "hygiene=$HYGIENE_RESULT"
            exit 1
          fi

          if [[ "$FULL_REQUIRED" == "true" ]]; then
            if [[ "$JVM_ANDROID_LINUX_RESULT" != "success" ||
                  "$JVM_WINDOWS_RESULT" != "success" ||
                  "$APPLE_JVM_RESULT" != "success" ]]; then
              echo "Complete verification was required but a heavy job did not pass."
              echo "jvm-android-linux=$JVM_ANDROID_LINUX_RESULT"
              echo "jvm-windows=$JVM_WINDOWS_RESULT"
              echo "apple-jvm=$APPLE_JVM_RESULT"
              exit 1
            fi
          elif [[ "$FULL_REQUIRED" == "false" ]]; then
            if [[ "$JVM_ANDROID_LINUX_RESULT" != "skipped" ||
                  "$JVM_WINDOWS_RESULT" != "skipped" ||
                  "$APPLE_JVM_RESULT" != "skipped" ]]; then
              echo "Documentation-only verification expected every heavy job to be skipped."
              echo "jvm-android-linux=$JVM_ANDROID_LINUX_RESULT"
              echo "jvm-windows=$JVM_WINDOWS_RESULT"
              echo "apple-jvm=$APPLE_JVM_RESULT"
              exit 1
            fi
          else
            echo "Verification-impact classification did not produce a valid full_required value."
            exit 1
          fi

          if [[ "$FULL_REQUIRED" == "false" ]]; then
            echo "Required lightweight Universal AI Connector checks passed."
          else
            echo "jvm-android-linux=$JVM_ANDROID_LINUX_RESULT"
            echo "jvm-windows=$JVM_WINDOWS_RESULT"
            echo "apple-jvm=$APPLE_JVM_RESULT"
            echo "All required Universal AI Connector checks passed."
          fi
