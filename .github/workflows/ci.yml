name: Adidi Universal AI Connector CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classification:
    name: Classify verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      class: ${{ steps.classify.outputs.class }}
    steps:
      - name: Check out exact candidate history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Classify with trusted base policy
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          class=full
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
            if git cat-file -e "$base:scripts/verification-policy.py" 2>/dev/null; then
              git show "$base:scripts/verification-policy.py" > "$RUNNER_TEMP/verification-policy.py"
              class="$(python3 -I "$RUNNER_TEMP/verification-policy.py" classify "$GITHUB_WORKSPACE" "$base" "$HEAD_SHA")"
            fi
          fi
          case "$class" in docs|full) ;; *) exit 1 ;; esac
          echo "class=$class" >> "$GITHUB_OUTPUT"

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Run repository hygiene and script tests
        run: |
          ./scripts/check.sh --hygiene
          ./scripts/tests/run-android-sample-test.sh

  jvm-android-linux:
    needs: classification
    if: needs.classification.outputs.class == 'full'
    name: JVM + Android (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # 6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools platforms;android-36 platforms;android-37.0 build-tools;36.1.0

      - name: Run JVM and Android checks
        run: >-
          ./gradlew
          :bridge:jvmTest
          :bridge:testAndroidHostTest
          :bridge:bundleAndroidMainAar
          :samples:jvm-console:consumerCheck :samples:host-controller:test :samples:desktop:consumerCheck
          :samples:android:consumerCheck
          --stacktrace

      - name: Verify Kotlin sample parity evidence
        run: python3 -I scripts/sample-parity.py kotlin

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-jvm-android-failure-evidence
          path: |
            bridge/build/reports/tests/
            samples/jvm-console/build/reports/tests/
            samples/android/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

  jvm-windows:
    needs: classification
    if: needs.classification.outputs.class == 'full'
    name: JVM (Windows)
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # 6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Run JVM checks
        run: ./gradlew.bat :bridge:jvmTest :samples:jvm-console:consumerCheck :samples:host-controller:test :samples:desktop:consumerCheck --stacktrace

      - name: Verify JVM sample parity evidence
        run: python -I scripts/sample-parity.py jvm

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-jvm-failure-evidence
          path: |
            bridge/build/reports/tests/
            samples/jvm-console/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

  apple-jvm:
    needs: classification
    if: needs.classification.outputs.class == 'full'
    name: Apple + JVM (macOS)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install ripgrep
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install ripgrep

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # 6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools platforms;android-36 platforms;android-37.0 build-tools;36.1.0

      - name: Report toolchain versions
        run: |
          java -version
          xcodebuild -version

      - name: Run JVM checks
        run: ./gradlew :bridge:jvmTest :samples:jvm-console:consumerCheck :samples:host-controller:test :samples:desktop:consumerCheck --stacktrace

      - name: Run complete Apple verification
        env:
          UAC_SWIFT_RESULT_BUNDLE_PATH: ${{ runner.temp }}/uac-swift-package.xcresult
        run: ./scripts/check.sh --full

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apple-failure-evidence
          path: |
            ${{ runner.temp }}/uac-swift-package.xcresult
            bridge/build/reports/tests/
            samples/jvm-console/build/reports/tests/
            samples/android/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

  required-checks:
    name: Required checks
    if: always()
    runs-on: ubuntu-24.04
    needs:
      - classification
      - hygiene
      - jvm-android-linux
      - jvm-windows
      - apple-jvm
    steps:
      - name: Confirm required jobs passed
        env:
          CLASSIFICATION: ${{ needs.classification.outputs.class }}
          CLASSIFIER_RESULT: ${{ needs.classification.result }}
          HYGIENE_RESULT: ${{ needs.hygiene.result }}
          JVM_ANDROID_LINUX_RESULT: ${{ needs.jvm-android-linux.result }}
          JVM_WINDOWS_RESULT: ${{ needs.jvm-windows.result }}
          APPLE_JVM_RESULT: ${{ needs.apple-jvm.result }}
        run: |
          if [[ "$CLASSIFIER_RESULT" != success || "$HYGIENE_RESULT" != success ]]; then
            echo "Classification and hygiene must succeed."
            exit 1
          fi
          case "$CLASSIFICATION" in docs|full) ;; *) exit 1 ;; esac
          for result in "$JVM_ANDROID_LINUX_RESULT" "$JVM_WINDOWS_RESULT" "$APPLE_JVM_RESULT"; do
            if [[ "$result" == success ]]; then continue; fi
            if [[ "$CLASSIFICATION" == docs && "$result" == skipped ]]; then continue; fi
            echo "Required platform verification did not pass."
            exit 1
          done
          echo "All applicable Adidi Universal AI Connector checks passed."
